<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Seminar{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Harakatlanuvchi gradient fon */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #667eea);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Shaffof Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .navbar-brand, .nav-link {
            color: white !important;
            font-weight: 600;
            transition: 0.3s;
        }
        .nav-link:hover {
            color: #ffd700 !important;
            transform: translateY(-2px);
        }

        /* Chiroyli Kartalar */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            color: white;
        }
        .glass-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 45px 0 rgba(0, 0, 0, 0.4);
            border-color: #ffd700;
        }

        /* Video konteyner */
        .custom-video {
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.3);
            background-color: black;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Professional Navbar -->
   <ul class="navbar-nav ms-auto">
    <li class="nav-item"><a class="nav-link" href="/">Bosh sahifa</a></li>
    <li class="nav-item"><a class="nav-link" href="/topics/">Mavzular</a></li>
    <li class="nav-item"><a class="nav-link" href="/contact/">Aloqa</a></li>
</ul>
    <!-- Asosiy kontent -->
    <div class="container mt-5 mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center text-white py-4 mt-auto" style="background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);">
        <div class="container">
            <p class="mb-0">&copy; 2026 Seminar Pro. Barcha huquqlar himoyalangan.</p>
            <div class="mt-2">
                <a href="#" class="text-white me-3"><i class="fab fa-telegram fa-2x"></i></a>
                <a href="#" class="text-white me-3"><i class="fab fa-instagram fa-2x"></i></a>
                <a href="#" class="text-white"><i class="fab fa-youtube fa-2x"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
