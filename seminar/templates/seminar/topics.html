{% extends 'seminar/base.html' %}

{% block title %}Mavzular{% endblock %}

{% block content %}

<h2 class="text-center fw-bold mb-5"><i class="fas fa-layer-group me-2 text-warning"></i>Seminar Mavzulari</h2>

<div class="row">
    {% for topic in topics %}
    <div class="col-md-6 mb-4">
        <div class="glass-card p-4 h-100">
            <div class="row g-0">
                <!-- Rasm qismi -->
                <div class="col-md-4">
                    <img src="{{ topic.image }}" alt="{{ topic.name }}" class="img-fluid rounded-start h-100" style="object-fit: cover; min-height: 150px;">
                </div>
                <!-- Matn qismi -->
                <div class="col-md-8">
                    <div class="p-3">
                        <h5 class="fw-bold mb-2">{{ topic.name }}</h5>
                        <p class="text-white-50 small mb-3">{{ topic.desc }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
